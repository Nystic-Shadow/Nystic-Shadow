<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="Safir Akhtar — profile.sh --live">
  <defs>
    <!-- Animated Theme Gradients -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"><animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="10s" repeatCount="indefinite"/></stop>
      <stop offset="0.5" stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#10B981;#7C3AED;#22D3EE" dur="10s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#10B981"><animate attributeName="stop-color" values="#10B981;#7C3AED;#22D3EE;#10B981" dur="10s" repeatCount="indefinite"/></stop>
    </linearGradient>
    
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A101F"/>
      <stop offset="1" stop-color="#0C1426"/>
    </linearGradient>

    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#060A14"/>
      <stop offset="1" stop-color="#0E172A"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow8" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
    
    <!-- Background Cyber Grid -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.3"/>
      <circle cx="40" cy="0" r="1.5" fill="#22D3EE" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Base Container -->
  <rect width="1180" height="610" rx="16" fill="url(#panelGrad)" stroke="#1E293B" stroke-width="2"/>
  <rect width="1180" height="610" rx="16" fill="url(#gridPattern)"/>

  <!-- Glowing Orbs -->
  <circle cx="1050" cy="100" r="180" fill="#22D3EE" fill-opacity="0.08" filter="url(#glow8)"/>
  <circle cx="150" cy="500" r="160" fill="#7C3AED" fill-opacity="0.06" filter="url(#glow8)"/>

  <!-- Top Terminal Header Bar -->
  <path d="M 0 16 C 0 7.163 7.163 0 16 0 L 1164 0 C 1172.837 0 1180 7.163 1180 16 L 1180 48 L 0 48 Z" fill="url(#headerGrad)"/>
  <circle cx="28" cy="24" r="6.5" fill="#EF4444"/>
  <circle cx="48" cy="24" r="6.5" fill="#F59E0B"/>
  <circle cx="68" cy="24" r="6.5" fill="#10B981"/>
  <text x="590" y="29" text-anchor="middle" fill="#64748B" font-size="14" font-weight="600">safir-akhtar ~ profile.sh --live</text>
  <line x1="0" y1="48" x2="1180" y2="48" stroke="#1E293B" stroke-width="1"/>

  <!-- Left Side: Profile Hero Branding -->
  <g transform="translate(50, 75)">
    <!-- Dev Sign Crest </ > -->
    <g transform="translate(0, 10)">
      <rect width="90" height="90" rx="20" fill="#0F172A" stroke="url(#accent)" stroke-width="2"/>
      <text x="45" y="56" text-anchor="middle" fill="url(#accent)" font-size="34" font-weight="900" font-family="monospace">&lt;/&gt;</text>
    </g>

    <!-- Name & Professional Subtitle -->
    <text x="115" y="52" fill="url(#accent)" font-size="38" font-weight="800" font-family="'Segoe UI', sans-serif" letter-spacing="0.5">Safir Akhtar</text>
    <text x="115" y="82" fill="#94A3B8" font-size="16" font-weight="500" font-family="'Segoe UI', sans-serif">17 y/o Web Developer, UI/UX Designer &amp; AI Specialist</text>

    <!-- Skill Pills Matrix -->
    <g transform="translate(0, 130)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="165" height="34" rx="17" fill="#07233B" stroke="#0EA5E9" stroke-width="1"/>
      <text x="82.5" y="22" text-anchor="middle" fill="#38BDF8" font-size="13" font-weight="700" font-family="'Segoe UI', sans-serif">Python · Node · Go</text>
      
      <rect x="180" y="0" width="155" height="34" rx="17" fill="#1C1842" stroke="#6366F1" stroke-width="1"/>
      <text x="257.5" y="22" text-anchor="middle" fill="#818CF8" font-size="13" font-weight="700" font-family="'Segoe UI', sans-serif">Web Dev &amp; Design</text>

      <rect x="350" y="0" width="180" height="34" rx="17" fill="#2C0F59" stroke="#A855F7" stroke-width="1"/>
      <text x="440" y="22" text-anchor="middle" fill="#C084FC" font-size="13" font-weight="700" font-family="'Segoe UI', sans-serif">AI Workflows &amp; Prompts</text>

      <!-- Row 2 -->
      <rect x="0" y="48" width="160" height="34" rx="17" fill="#053B2E" stroke="#10B981" stroke-width="1"/>
      <text x="80" y="70" text-anchor="middle" fill="#34D399" font-size="13" font-weight="700" font-family="'Segoe UI', sans-serif">UI/UX (Figma / XD)</text>

      <rect x="175" y="48" width="180" height="34" rx="17" fill="#521354" stroke="#D946EF" stroke-width="1"/>
      <text x="265" y="70" text-anchor="middle" fill="#F0ABFC" font-size="13" font-weight="700" font-family="'Segoe UI', sans-serif">Graphics (Ps / Ai / CDR)</text>

      <rect x="370" y="48" width="160" height="34" rx="17" fill="#5C1632" stroke="#F43F5E" stroke-width="1"/>
      <text x="450" y="70" text-anchor="middle" fill="#FB7185" font-size="13" font-weight="700" font-family="'Segoe UI', sans-serif">Video Editing (Pr / AE)</text>
    </g>

    <!-- Live Status Card -->
    <g transform="translate(0, 260)">
      <rect width="530" height="90" rx="16" fill="#081022" stroke="#1E293B" stroke-width="1.5"/>
      <circle cx="32" cy="45" r="7" fill="#10B981">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="32" cy="45" r="12" fill="none" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.5">
        <animate attributeName="r" values="7;16;7" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="56" y="40" fill="#F8FAFC" font-size="15" font-weight="700" font-family="'Segoe UI', sans-serif">STATUS: <tspan fill="#10B981">DEVELOPING &amp; AUTOMATING</tspan></text>
      <text x="56" y="63" fill="#94A3B8" font-size="13" font-family="'Segoe UI', sans-serif">Full-Stack Systems · Creative Design · AI Workflows</text>
    </g>
  </g>

  <!-- Right Side: Terminal Info Panel -->
  <g transform="translate(610, 75)">
    <rect width="520" height="480" rx="16" fill="#050B17" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Info Panel Bar -->
    <path d="M 0 16 C 0 7.163 7.163 0 16 0 L 504 0 C 512.837 0 520 7.163 520 16 L 520 38 L 0 38 Z" fill="#0A1226"/>
    <text x="260" y="24" text-anchor="middle" fill="#64748B" font-size="13" font-weight="600">user-profile.json</text>
    <line x1="0" y1="38" x2="520" y2="38" stroke="#1E293B" stroke-width="1"/>

    <!-- Terminal Spec Rows -->
    <g transform="translate(25, 40)" font-size="13.5">
      <!-- Row 1 -->
      <text y="35" fill="#A78BFA" font-weight="700">Subject</text>
      <text x="110" y="35" fill="#334155">........................................</text>
      <text x="470" y="35" text-anchor="end" fill="#F8FAFC">Safir Akhtar</text>

      <!-- Row 2 -->
      <text y="72" fill="#A78BFA" font-weight="700">Age</text>
      <text x="110" y="72" fill="#334155">........................................</text>
      <text x="470" y="72" text-anchor="end" fill="#22D3EE">17 Years Old</text>

      <!-- Row 3 -->
      <text y="109" fill="#A78BFA" font-weight="700">Handle</text>
      <text x="110" y="109" fill="#334155">........................................</text>
      <text x="470" y="109" text-anchor="end" fill="#F472B6">@Nystic-Shadow</text>

      <!-- Row 4 -->
      <text y="146" fill="#A78BFA" font-weight="700">Dev.Sign</text>
      <text x="110" y="146" fill="#334155">........................................</text>
      <text x="470" y="146" text-anchor="end" fill="#10B981">&lt;/&gt; Full-Stack &amp; Creative</text>

      <!-- Row 5 -->
      <text y="183" fill="#A78BFA" font-weight="700">Core.Lang</text>
      <text x="110" y="183" fill="#334155">........................................</text>
      <text x="470" y="183" text-anchor="end" fill="#38BDF8">Python · Node.js · Go</text>

      <!-- Row 6 -->
      <text y="220" fill="#A78BFA" font-weight="700">Web.Dev</text>
      <text x="110" y="220" fill="#334155">........................................</text>
      <text x="470" y="220" text-anchor="end" fill="#60A5FA">HTML5 · CSS3 · JavaScript</text>

      <!-- Row 7 -->
      <text y="257" fill="#A78BFA" font-weight="700">UI/UX.Tools</text>
      <text x="110" y="257" fill="#334155">........................................</text>
      <text x="470" y="257" text-anchor="end" fill="#F0ABFC">Figma · Adobe XD · Canva</text>

      <!-- Row 8 -->
      <text y="294" fill="#A78BFA" font-weight="700">Graphic.Tools</text>
      <text x="110" y="294" fill="#334155">........................................</text>
      <text x="470" y="294" text-anchor="end" fill="#E9D5FF">Photoshop · Illustrator · CorelDRAW</text>

      <!-- Row 9 -->
      <text y="331" fill="#A78BFA" font-weight="700">Video.Tools</text>
      <text x="110" y="331" fill="#334155">........................................</text>
      <text x="470" y="331" text-anchor="end" fill="#FB7185">Premiere Pro · After Effects</text>

      <!-- Row 10 -->
      <text y="368" fill="#A78BFA" font-weight="700">Dev.Tools</text>
      <text x="110" y="368" fill="#334155">........................................</text>
      <text x="470" y="368" text-anchor="end" fill="#94A3B8">VS Code · Git</text>

      <!-- Row 11 -->
      <text y="405" fill="#A78BFA" font-weight="700">AI.Skill</text>
      <text x="110" y="405" fill="#334155">........................................</text>
      <text x="470" y="405" text-anchor="end" fill="#34D399">Prompt Engineering &amp; Automation</text>
    </g>
  </g>
</svg>
