<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" role="img" aria-label="Safir Akhtar — profile.sh --live">
  <defs>
    <!-- Light Mode Animated Gradients -->
    <linearGradient id="accent-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891B2"><animate attributeName="stop-color" values="#0891B2;#7C3AED;#059669;#0891B2" dur="10s" repeatCount="indefinite"/></stop>
      <stop offset="0.5" stop-color="#7C3AED"><animate attributeName="stop-color" values="#7C3AED;#059669;#0891B2;#7C3AED" dur="10s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#059669"><animate attributeName="stop-color" values="#059669;#0891B2;#7C3AED;#059669" dur="10s" repeatCount="indefinite"/></stop>
    </linearGradient>
    
    <linearGradient id="panelGradLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Light Mode Background Cyber Grid -->
    <pattern id="gridPatternLight" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="0.75"/>
      <circle cx="40" cy="0" r="1.5" fill="#0891B2" fill-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Base Container -->
  <rect width="1180" height="610" rx="16" fill="url(#panelGradLight)" stroke="#CBD5E1" stroke-width="2"/>
  <rect width="1180" height="610" rx="16" fill="url(#gridPatternLight)"/>

  <!-- Top Terminal Header Bar -->
  <path d="M 0 16 C 0 7.163 7.163 0 16 0 L 1164 0 C 1172.837 0 1180 7.163 1180 16 L 1180 48 L 0 48 Z" fill="#E2E8F0"/>
  <circle cx="28" cy="24" r="6.5" fill="#EF4444"/>
  <circle cx="48" cy="24" r="6.5" fill="#F59E0B"/>
  <circle cx="68" cy="24" r="6.5" fill="#10B981"/>
  <text x="590" y="29" text-anchor="middle" fill="#475569" font-size="14" font-weight="600">safir-akhtar ~ profile.sh --live</text>
  <line x1="0" y1="48" x2="1180" y2="48" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Left Side: Profile Hero Branding -->
  <g transform="translate(50, 75)">
    <!-- Dev Sign Crest </ > -->
    <g transform="translate(0, 10)">
      <rect width="90" height="90" rx="20" fill="#F8FAFC" stroke="url(#accent-light)" stroke-width="2"/>
      <text x="45" y="56" text-anchor="middle" fill="url(#accent-light)" font-size="34" font-weight="900" font-family="monospace">&lt;/&gt;</text>
    </g>

    <!-- Name & Professional Subtitle -->
    <text x="115" y="52" fill="url(#accent-light)" font-size="38" font-weight="800" font-family="'Segoe UI', sans-serif" letter-spacing="0.5">Safir Akhtar</text>
    <text x="115" y="82" fill="#475569" font-size="16" font-weight="500" font-family="'Segoe UI', sans-serif">17 y/o Web Developer, UI/UX Designer &amp; AI Specialist</text>

    <!-- Skill Pills Matrix -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="165" height="34" rx="17" fill="#E0F2FE" stroke="#0284C7" stroke-width="1"/>
      <text x="82.5" y="22" text-anchor="middle" fill="#0369A1" font-size="13" font-weight="700" font-family="'Segoe UI', sans-serif">Python · Node · Go</text>
      
      <rect x="180" y="0" width="155" height="34" rx="17" fill="#EEF2FF" stroke="#6366F1" stroke-width="1"/>
      <text x="257.5" y="22" text-anchor="middle" fill="#4338CA" font-size="13" font-weight="700" font-family="'Segoe UI', sans-serif">Web Dev &amp; Design</text>

      <rect x="350" y="0" width="180" height="34" rx="17" fill="#F3E8FF" stroke="#A855F7" stroke-width="1"/>
      <text x="440" y="22" text-anchor="middle" fill="#7E22CE" font-size="13" font-weight="700" font-family="'Segoe UI', sans-serif">AI Workflows &amp; Prompts</text>

      <rect x="0" y="48" width="160" height="34" rx="17" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
      <text x="80" y="70" text-anchor="middle" fill="#047857" font-size="13" font-weight="700" font-family="'Segoe UI', sans-serif">UI/UX (Figma / XD)</text>

      <rect x="175" y="48" width="180" height="34" rx="17" fill="#FDF4FF" stroke="#D946EF" stroke-width="1"/>
      <text x="265" y="70" text-anchor="middle" fill="#A21CAF" font-size="13" font-weight="700" font-family="'Segoe UI', sans-serif">Graphics (Ps / Ai / CDR)</text>

      <rect x="370" y="48" width="160" height="34" rx="17" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1"/>
      <text x="450" y="70" text-anchor="middle" fill="#BE123C" font-size="13" font-weight="700" font-family="'Segoe UI', sans-serif">Video Editing (Pr / AE)</text>
    </g>

    <!-- Live Status Card -->
    <g transform="translate(0, 260)">
      <rect width="530" height="90" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
      <circle cx="32" cy="45" r="7" fill="#059669">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="32" cy="45" r="12" fill="none" stroke="#059669" stroke-width="1.5" stroke-opacity="0.5">
        <animate attributeName="r" values="7;16;7" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="56" y="40" fill="#0F172A" font-size="15" font-weight="700" font-family="'Segoe UI', sans-serif">STATUS: <tspan fill="#059669">DEVELOPING &amp; AUTOMATING</tspan></text>
      <text x="56" y="63" fill="#64748B" font-size="13" font-family="'Segoe UI', sans-serif">Full-Stack Systems · Creative Design · AI Workflows</text>
    </g>
  </g>

  <!-- Right Side: Terminal Info Panel -->
  <g transform="translate(610, 75)">
    <rect width="520" height="480" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    
    <path d="M 0 16 C 0 7.163 7.163 0 16 0 L 504 0 C 512.837 0 520 7.163 520 16 L 520 38 L 0 38 Z" fill="#E2E8F0"/>
    <text x="260" y="24" text-anchor="middle" fill="#475569" font-size="13" font-weight="600">user-profile.json</text>
    <line x1="0" y1="38" x2="520" y2="38" stroke="#CBD5E1" stroke-width="1"/>

    <!-- Terminal Spec Rows -->
    <g transform="translate(25, 40)" font-size="13.5">
      <text y="35" fill="#7C3AED" font-weight="700">Subject</text>
      <text x="110" y="35" fill="#CBD5E1">........................................</text>
      <text x="470" y="35" text-anchor="end" fill="#0F172A">Safir Akhtar</text>

      <text y="72" fill="#7C3AED" font-weight="700">Age</text>
      <text x="110" y="72" fill="#CBD5E1">........................................</text>
      <text x="470" y="72" text-anchor="end" fill="#0891B2">17 Years Old</text>

      <text y="109" fill="#7C3AED" font-weight="700">Handle</text>
      <text x="110" y="109" fill="#CBD5E1">........................................</text>
      <text x="470" y="109" text-anchor="end" fill="#BE123C">@Nystic-Shadow</text>

      <text y="146" fill="#7C3AED" font-weight="700">Dev.Sign</text>
      <text x="110" y="146" fill="#CBD5E1">........................................</text>
      <text x="470" y="146" text-anchor="end" fill="#059669">&lt;/&gt; Full-Stack &amp; Creative</text>

      <text y="183" fill="#7C3AED" font-weight="700">Core.Lang</text>
      <text x="110" y="183" fill="#CBD5E1">........................................</text>
      <text x="470" y="183" text-anchor="end" fill="#0369A1">Python · Node.js · Go</text>

      <text y="220" fill="#7C3AED" font-weight="700">Web.Dev</text>
      <text x="110" y="220" fill="#CBD5E1">........................................</text>
      <text x="470" y="220" text-anchor="end" fill="#1D4ED8">HTML5 · CSS3 · JavaScript</text>

      <text y="257" fill="#7C3AED" font-weight="700">UI/UX.Tools</text>
      <text x="110" y="257" fill="#CBD5E1">........................................</text>
      <text x="470" y="257" text-anchor="end" fill="#A21CAF">Figma · Adobe XD · Canva</text>

      <text y="294" fill="#7C3AED" font-weight="700">Graphic.Tools</text>
      <text x="110" y="294" fill="#CBD5E1">........................................</text>
      <text x="470" y="294" text-anchor="end" fill="#475569">Photoshop · Illustrator · CorelDRAW</text>

      <text y="331" fill="#7C3AED" font-weight="700">Video.Tools</text>
      <text x="110" y="331" fill="#CBD5E1">........................................</text>
      <text x="470" y="331" text-anchor="end" fill="#BE123C">Premiere Pro · After Effects</text>

      <text y="368" fill="#7C3AED" font-weight="700">Dev.Tools</text>
      <text x="110" y="368" fill="#CBD5E1">........................................</text>
      <text x="470" y="368" text-anchor="end" fill="#475569">VS Code · Git</text>

      <text y="405" fill="#7C3AED" font-weight="700">AI.Skill</text>
      <text x="110" y="405" fill="#CBD5E1">........................................</text>
      <text x="470" y="405" text-anchor="end" fill="#047857">Prompt Engineering &amp; Automation</text>
    </g>
  </g>
</svg>
