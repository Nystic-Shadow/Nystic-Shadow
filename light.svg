<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%" style="background: transparent; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Light Mode Gradients -->
    <linearGradient id="bg-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    
    <linearGradient id="text-grad-primary-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="40%" stop-color="#4F46E5" />
      <stop offset="80%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <linearGradient id="border-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.8" />
    </linearGradient>

    <!-- Light Grid Pattern -->
    <pattern id="cyber-grid-light" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E2E8F0" stroke-width="0.75" />
      <circle cx="30" cy="0" r="1" fill="#0284C7" fill-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Base Card Container -->
  <rect x="2" y="2" width="916" height="376" rx="20" fill="url(#bg-grad-light)" stroke="url(#border-light)" stroke-width="2" />
  
  <!-- Cyber Grid Background -->
  <rect x="2" y="2" width="916" height="376" rx="20" fill="url(#cyber-grid-light)" />

  <!-- Terminal Top Header Bar -->
  <path d="M 2 20 C 2 10.059 10.059 2 20 2 L 900 2 C 909.941 2 918 10.059 918 20 L 918 46 L 2 46 Z" fill="#E2E8F0" />
  <circle cx="26" cy="24" r="6" fill="#FF5F56" />
  <circle cx="46" cy="24" r="6" fill="#FFBD2E" />
  <circle cx="66" cy="24" r="6" fill="#27C93F" />
  <text x="460" y="28" text-anchor="middle" fill="#475569" font-size="13" font-weight="600" font-family="monospace">safir-akhtar ~ nystic-shadow @ dev-terminal</text>
  <line x1="2" y1="46" x2="918" y2="46" stroke="#CBD5E1" stroke-width="1" />

  <!-- LEFT SECTION: Avatar Crest & Bio -->
  <!-- Glowing Cyber Crest -->
  <g transform="translate(42, 72)">
    <rect x="-4" y="-4" width="88" height="88" rx="22" fill="none" stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.6">
      <animate attributeName="stroke-opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite" />
    </rect>
    <rect x="0" y="0" width="80" height="80" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" />
    
    <!-- Stylized Monogram N/S -->
    <path d="M 22 58 L 40 22 L 58 58 L 48 58 L 40 40 L 32 58 Z" fill="url(#text-grad-primary-light)" />
    <circle cx="40" cy="30" r="3.5" fill="#0284C7" />
  </g>

  <!-- Name & Title -->
  <text x="142" y="108" fill="url(#text-grad-primary-light)" font-size="34" font-weight="800" letter-spacing="0.5">Safir Akhtar</text>
  <text x="142" y="136" fill="#475569" font-size="15" font-weight="500">17 y/o Full-Stack Developer &amp; Creative Technologist</text>
  
  <!-- Badges / Tags Matrix -->
  <g transform="translate(42, 168)">
    <rect x="0" y="0" width="145" height="30" rx="15" fill="#E0F2FE" stroke="#0284C7" stroke-width="1" />
    <text x="72.5" y="19" text-anchor="middle" fill="#0369A1" font-size="12" font-weight="700">Python · Node · Go</text>
    
    <rect x="155" y="0" width="135" height="30" rx="15" fill="#EEF2FF" stroke="#6366F1" stroke-width="1" />
    <text x="222.5" y="19" text-anchor="middle" fill="#4338CA" font-size="12" font-weight="700">HTML5 · CSS3 · JS</text>

    <rect x="300" y="0" width="145" height="30" rx="15" fill="#F3E8FF" stroke="#A855F7" stroke-width="1" />
    <text x="372.5" y="19" text-anchor="middle" fill="#7E22CE" font-size="12" font-weight="700">AI Prompting &amp; LLMs</text>

    <rect x="0" y="42" width="130" height="30" rx="15" fill="#ECFDF5" stroke="#10B981" stroke-width="1" />
    <text x="65" y="61" text-anchor="middle" fill="#047857" font-size="12" font-weight="700">UI/UX (Figma)</text>

    <rect x="140" y="42" width="155" height="30" rx="15" fill="#FDF4FF" stroke="#D946EF" stroke-width="1" />
    <text x="217.5" y="61" text-anchor="middle" fill="#A21CAF" font-size="12" font-weight="700">3D Design (Blender)</text>

    <rect x="305" y="42" width="140" height="30" rx="15" fill="#FFF1F2" stroke="#F43F5E" stroke-width="1" />
    <text x="375" y="61" text-anchor="middle" fill="#BE123C" font-size="12" font-weight="700">Video &amp; Motion</text>
  </g>

  <!-- Live Status Card -->
  <g transform="translate(42, 280)">
    <rect x="0" y="0" width="403" height="74" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    
    <circle cx="26" cy="37" r="6" fill="#059669">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="26" cy="37" r="10" fill="none" stroke="#059669" stroke-width="1.5" stroke-opacity="0.5">
      <animate attributeName="r" values="6;14;6" dur="2s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
    </circle>

    <text x="46" y="34" fill="#0F172A" font-size="13" font-weight="700">SYSTEM STATUS: <tspan fill="#059669">ONLINE &amp; SHIPPING</tspan></text>
    <text x="46" y="54" fill="#64748B" font-size="12">Architecting full-stack applications, AI tools &amp; visual media</text>
  </g>

  <!-- RIGHT SECTION: Terminal Info Box -->
  <g transform="translate(470, 72)">
    <rect x="0" y="0" width="408" height="282" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" />
    
    <rect x="0" y="0" width="408" height="32" rx="14" fill="#E2E8F0" />
    <text x="204" y="21" text-anchor="middle" fill="#475569" font-size="12" font-family="monospace" font-weight="600">user-specifications.json</text>

    <!-- Info Table Rows -->
    <text x="20" y="60" fill="#6D28D9" font-size="13" font-family="monospace" font-weight="700">Subject</text>
    <text x="100" y="60" fill="#CBD5E1" font-size="13" font-family="monospace">............................</text>
    <text x="388" y="60" text-anchor="end" fill="#0F172A" font-size="13" font-family="monospace">Safir Akhtar</text>

    <text x="20" y="90" fill="#6D28D9" font-size="13" font-family="monospace" font-weight="700">Age</text>
    <text x="100" y="90" fill="#CBD5E1" font-size="13" font-family="monospace">............................</text>
    <text x="388" y="90" text-anchor="end" fill="#0284C7" font-size="13" font-family="monospace">17 Years Old</text>

    <text x="20" y="120" fill="#6D28D9" font-size="13" font-family="monospace" font-weight="700">Handle</text>
    <text x="100" y="120" fill="#CBD5E1" font-size="13" font-family="monospace">............................</text>
    <text x="388" y="120" text-anchor="end" fill="#BE123C" font-size="13" font-family="monospace">@Nystic-Shadow</text>

    <text x="20" y="150" fill="#6D28D9" font-size="13" font-family="monospace" font-weight="700">Core.Lang</text>
    <text x="100" y="150" fill="#CBD5E1" font-size="13" font-family="monospace">............................</text>
    <text x="388" y="150" text-anchor="end" fill="#4338CA" font-size="13" font-family="monospace">Python · Node · Go</text>

    <text x="20" y="180" fill="#6D28D9" font-size="13" font-family="monospace" font-weight="700">Frontend</text>
    <text x="100" y="180" fill="#CBD5E1" font-size="13" font-family="monospace">............................</text>
    <text x="388" y="180" text-anchor="end" fill="#1D4ED8" font-size="13" font-family="monospace">HTML5 · CSS3 · JS</text>

    <text x="20" y="210" fill="#6D28D9" font-size="13" font-family="monospace" font-weight="700">Creative</text>
    <text x="100" y="210" fill="#CBD5E1" font-size="13" font-family="monospace">............................</text>
    <text x="388" y="210" text-anchor="end" fill="#A21CAF" font-size="13" font-family="monospace">UI/UX · Graphic · 3D</text>

    <text x="20" y="240" fill="#6D28D9" font-size="13" font-family="monospace" font-weight="700">Media</text>
    <text x="100" y="240" fill="#CBD5E1" font-size="13" font-family="monospace">............................</text>
    <text x="388" y="240" text-anchor="end" fill="#BE123C" font-size="13" font-family="monospace">Video Editing · Motion</text>

    <text x="20" y="268" fill="#6D28D9" font-size="13" font-family="monospace" font-weight="700">AI Skill</text>
    <text x="100" y="268" fill="#CBD5E1" font-size="13" font-family="monospace">............................</text>
    <text x="388" y="268" text-anchor="end" fill="#047857" font-size="13" font-family="monospace">Prompt Engineering</text>
  </g>
</svg>
